<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F3864" />
    <meta name="description" content="Sistema POS e Inventario — Lubricentro E' Manuel" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello blanco en modo oscuro.
      (function () {
        try {
          var t = localStorage.getItem('lem-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0f1c');
          }
        } catch (e) {}
      })();
    </script>
    <title>Lubricentro E' Manuel POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
