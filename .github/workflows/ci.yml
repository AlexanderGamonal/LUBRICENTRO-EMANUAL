name: CI

on:
  push:
    branches:
      - main
      - "fase/**"
      - "claude/**"
  pull_request:

jobs:
  ci:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '\''https://placeholder.supabase.co'\'' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || '\''placeholder-key'\'' }}
          VITE_PWA_BASE_URL: ${{ secrets.VITE_PWA_BASE_URL || '\''https://pos.lubricentromanuel.com'\'' }}
